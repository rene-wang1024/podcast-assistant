# 节目档案：换成你自己的节目。流水线里所有和节目相关的内容都从这里读。
# examples/shows/ 下有几个现成的例子，可以直接复制过来改。

name: 我的知识播客
tagline: 用聊天的方式把一个专业话题讲清楚
domain: 通识              # 领域，如 法律 / 历史 / 科学 / 商业 / 心理学 / 医学
format: 多人对谈          # 单人讲述 / 双人对谈 / 多人对谈 / 访谈
language: zh-CN

# 领域的准确性要求：精剪、Show notes 和分发都会按这些检查
accuracy_rules:
  - 专业概念、数据、出处必须和录音一致，不补充录音里没讲的内容
  - 有争议的观点保留说话人的限定语（“我认为”“目前研究显示”）

# 发布时的免责声明，没有可以留空
disclaimer: 本节目内容仅供交流，不构成专业意见。

# 封面风格
brand:
  style: 扁平插画，浅色底，主色加一个强调色，留白充足
  title_font: 粗黑体
  fixed_elements: 右下角留出节目 Logo 位置（后期叠加，不让模型生成）
  avoid: 真实人物肖像、真实机构徽标

# 分发平台：删掉不用的，或者加上新的
platforms:
  - 小宇宙
  - Apple Podcasts
  - 喜马拉雅
  - 小红书
  - 抖音
  - B站
  - 微信公众号
