[project]
name = "podcast-assistant"
version = "0.1.0"
description = "知识类播客的团队协作工作台：录制、粗剪、精剪、Show notes、分发按步骤流转，每一步 AI 先做、人审核"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1"]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
all = ["openai>=1.50", "anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline", "app"]
