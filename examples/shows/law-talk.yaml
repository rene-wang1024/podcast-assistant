# 案例：法律类三人对谈（本项目最初就是为这类节目做的）
name: 不严肃法律
tagline: 用轻松聊天讲清楚普通人身边的法律风险
domain: 法律
format: 多人对谈
language: zh-CN
accuracy_rules:
  - 法条、罪名、数字必须和录音一致，不补充录音里没讲的法条号
  - 涉及具体案件用“据报道”，不对未判决的案件下结论，不暗示具体个人有罪
  - 推测和假设要保留说话人的限定语
disclaimer: 本节目内容仅供交流，不构成法律意见。
brand:
  style: 扁平插画，暖白底色，深蓝与橙色点缀，线条圆润，留白充足
  title_font: 粗黑体，字距略宽
  fixed_elements: 右下角留出节目 Logo 位置（后期叠加）
  avoid: 真实人物肖像、法院或警察徽标、血腥暴力元素
platforms: [小宇宙, Apple Podcasts, 小红书, B站, 视频号]
