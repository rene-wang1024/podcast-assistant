{% extends "base.html" %}
{% block content %}
<div class="head"><div><h1>成员</h1><p class="muted">手机号用于企业微信群里 @ 人，需要和对方企业微信绑定的手机号一致。</p></div></div>

<div class="card">
<table>
  <tr><th>用户名</th><th>显示名</th><th>角色</th><th>手机号</th><th>管理员</th><th>启用</th><th>重置密码</th><th></th></tr>
  {% for u in users %}<tr><form method="post">
    <input type="hidden" name="action" value="update"><input type="hidden" name="id" value="{{ u.id }}">
    <td>{{ u.username }}</td>
    <td><input type="text" name="display_name" value="{{ u.display_name }}"></td>
    <td><select name="role">{% for k, v in ROLES.items() %}<option value="{{ k }}" {{ 'selected' if u.role == k }}>{{ v }}</option>{% endfor %}</select></td>
    <td><input type="tel" name="mobile" value="{{ u.mobile or '' }}" style="width:130px"></td>
    <td><input type="checkbox" name="is_admin" {{ 'checked' if u.is_admin }}></td>
    <td><input type="checkbox" name="active" {{ 'checked' if u.active }}></td>
    <td><input type="password" name="new_password" placeholder="不改留空" style="width:120px"></td>
    <td><button class="btn small">保存</button></td>
  </form></tr>{% endfor %}
</table>
</div>

<form method="post" class="card">
  <h2>添加成员</h2>
  <input type="hidden" name="action" value="create">
  <div class="grid">
    <div><label>用户名<span class="req">*</span></label><input type="text" name="username" required></div>
    <div><label>显示名</label><input type="text" name="display_name"></div>
    <div><label>角色<span class="req">*</span></label><select name="role">{% for k, v in ROLES.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    <div><label>初始密码<span class="req">*</span><span class="help">至少 8 位</span></label><input type="text" name="password" required minlength="8"></div>
    <div><label>手机号</label><input type="tel" name="mobile"></div>
    <div><label>&nbsp;</label><label class="check"><input type="checkbox" name="is_admin"> 管理员</label></div>
  </div>
  <div class="btns"><button class="btn primary">添加</button></div>
</form>
{% endblock %}
