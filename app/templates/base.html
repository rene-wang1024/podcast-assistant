<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}播客协作工作台{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="topbar"><div class="inner">
  <a class="logo" href="/"><span class="dot"></span>播客工作台</a>
  <nav class="nav">
    <a href="/" class="{{ 'on' if request.url.path == '/' }}">待我处理</a>
    <a href="/episodes" class="{{ 'on' if request.url.path.startswith('/episodes') }}">全部节目</a>
    {% if user.is_admin %}<a href="/users" class="{{ 'on' if request.url.path == '/users' }}">成员</a>
    <a href="/settings" class="{{ 'on' if request.url.path == '/settings' }}">设置</a>{% endif %}
  </nav>
  <div class="right">
    <a class="muted small" href="/account">{{ user.display_name }} · {{ ROLES[user.role] }}</a>
    <form method="post" action="/logout"><button class="btn ghost small">退出</button></form>
  </div>
</div></header>
{% endif %}
<main class="{% block main_class %}wrap{% endblock %}">
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
