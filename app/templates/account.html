{% extends "base.html" %}
{% block content %}
<div class="head"><h1>我的账号</h1></div>
<form method="post" class="card" style="max-width:520px">
  <p class="muted">用户名：{{ user.username }} · 角色：{{ ROLES[user.role] }}</p>
  <label>显示名</label><input type="text" name="display_name" value="{{ user.display_name }}">
  <label>手机号<span class="help">企业微信群里 @ 你用</span></label><input type="tel" name="mobile" value="{{ user.mobile or '' }}">
  <h2 style="margin-top:24px">修改密码</h2>
  <label>原密码</label><input type="password" name="old_password">
  <label>新密码<span class="help">不改留空</span></label><input type="password" name="new_password" minlength="8">
  <div class="btns"><button class="btn primary">保存</button></div>
</form>
{% endblock %}
